; ==============================================================================
; Antigravity Proxy Launcher 配置文件
; ==============================================================================
[proxy]
; 备用默认代理地址
; 当 Windows 未开启系统代理开关时，启动器将自动 fallback 回退到此代理地址
; 常见端口：Clash Verge/Mihomo (7897 / 7898), Clash for Windows (7890), v2rayN (10809)
default_proxy=http://127.0.0.1:7898

; 自定义 Antigravity IDE 路径（留空则自动检测安装路径）
custom_exe_path=
